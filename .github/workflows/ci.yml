name: CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      # Build only; images are published by release.yml on a version tag.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ntripmonitor:ci
          cache-from: type=gha,scope=ntripmonitor
          cache-to: type=gha,mode=max,scope=ntripmonitor

      # Runs ingest the way it runs in production: non-root, read-only root filesystem,
      # no capabilities and a tmpfs on /tmp, against a database created from initdb/.
      # There is no caster in CI, so the test passes once ingest has connected to the
      # database and moved on to requesting the source table.
      - name: Smoke test
        run: |
          set -euo pipefail
          docker network create smoke
          mounts=()
          for f in initdb/*.sql; do
            mounts+=(-v "$PWD/$f:/docker-entrypoint-initdb.d/$(basename "$f"):ro")
          done
          docker run -d --name db --network smoke \
            -e POSTGRES_PASSWORD=smoke -e POSTGRES_DB=UREGA -e TIMESCALEDB_TELEMETRY=off \
            "${mounts[@]}" timescale/timescaledb:latest-pg17
          for attempt in $(seq 1 60); do
            docker exec db psql -U postgres -d UREGA -tAc \
              "SELECT 1 FROM pg_proc WHERE proname = 'update_reconnect_log'" 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          # Logs go through a variable: grep -q on a pipe exits at the first match, docker logs
          # then dies from SIGPIPE, and pipefail turns the match into a failure.
          dblogs=$(docker logs db 2>&1)
          if grep -q "psql:/docker-entrypoint-initdb.d/.*ERROR" <<<"$dblogs"; then
            echo "::error::initdb/ failed to apply"
            docker logs db
            exit 1
          fi
          docker run -d --name ingest --network smoke \
            --read-only --tmpfs /tmp --user 1000:1000 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e DB_HOST=db -e DB_PORT=5432 -e DB_NAME=UREGA -e DB_USER=postgres -e DB_PASSWORD=smoke \
            -e DB_STORE_OBSERVATIONS=True -e MULTIPROCESSING_ACTIVE=True \
            -e MAX_READERS=1 -e READERS_PER_DECODER=1 -e CLEAR_CHECK=0.1 -e APPEND_CHECK=0.1 \
            -e FIRST_CASTER_ID=Smoke -e FIRST_CASTER_URL=http://caster.invalid:2101 \
            -e FIRST_CASTER_USER=smoke -e FIRST_CASTER_PASSWORD=smoke -e FIRST_CASTER_MOUNTPOINT=SMOKE \
            ntripmonitor:ci
          for attempt in $(seq 1 30); do
            logs=$(docker logs ingest 2>&1)
            grep -q "Requesting source table" <<<"$logs" && break
            sleep 2
          done
          logs=$(docker logs ingest 2>&1)
          echo "$logs"
          if ! grep -q "Database is initialized" <<<"$logs"; then
            echo "::error::ingest did not connect to the database"
            exit 1
          fi
          if ! grep -q "Requesting source table" <<<"$logs"; then
            echo "::error::ingest did not get past start-up"
            exit 1
          fi
          if grep -q -E "Traceback|Read-only file system|Permission denied" <<<"$logs"; then
            echo "::error::ingest failed under a read-only root filesystem"
            exit 1
          fi
